<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch - Şifremi Unuttum</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/grid.css">
    <style>
        .container { padding: 100px 20px; text-align: center; max-width: 500px; margin: auto; }
        .reset-btn { background-color: #1aad2e; color: white; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; }
        .reset-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .form-input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 16px; }
        .message { margin-top: 20px; padding: 10px; border-radius: 8px; display: none; }
        .success { background-color: #e8f5e9; color: #2e7d32; display: block; }
        .error { background-color: #ffebee; color: #c62828; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/app_logo.png" width="80" style="border-radius: 15px; margin-bottom: 20px;">
        <h2 style="font-size: 2rem;">Şifreni mi Unuttun?</h2>
        <p style="margin: 15px 0; color: #666;">E-posta adresini gir, sana şifre sıfırlama bağlantısı gönderelim.</p>
        
        <form id="resetForm">
            <input type="email" id="email" class="form-input" placeholder="E-posta adresiniz" required>
            <button type="submit" id="submitBtn" class="reset-btn">Sıfırlama Bağlantısı Gönder</button>
        </form>
        <div id="statusMsg" class="message"></div>
        <a href="/" style="display: block; margin-top: 20px; color: #1aad2e;">Ana Sayfaya Dön</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // lib/firebase_options.dart dosyasından alınan yapılandırma
        const firebaseConfig = {
            apiKey: "AIzaSyAsHFffuxGA1cYKbHBs8LE6QbJOi4pjwC4",
            authDomain: "movie-matching-8a836.firebaseapp.com",
            projectId: "movie-matching-8a836",
            storageBucket: "movie-matching-8a836.firebasestorage.app",
            messagingSenderId: "266660427246",
            appId: "1:266660427246:web:4dcb77ff5e91e47dc04aff"
        };
        firebase.initializeApp(firebaseConfig);

        const resetForm = document.getElementById('resetForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');

        resetForm.onsubmit = async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            submitBtn.disabled = true;
            statusMsg.className = 'message';
            statusMsg.innerText = 'Gönderiliyor...';

            try {
                await firebase.auth().sendPasswordResetEmail(email);
                statusMsg.innerText = 'Şifre sıfırlama bağlantısı e-posta adresinize gönderildi! Lütfen gelen kutunuzu (ve spam klasörünü) kontrol edin.';
                statusMsg.className = 'message success';
                resetForm.reset();
            } catch (error) {
                let errorTxt = 'Bir hata oluştu.';
                if (error.code === 'auth/user-not-found') errorTxt = 'Bu e-posta adresiyle kayıtlı bir kullanıcı bulunamadı.';
                statusMsg.innerText = 'Hata: ' + errorTxt;
                statusMsg.className = 'message error';
            } finally {
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
